name: tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Unit tests (engines, storage, design system)
        run: python tests/test_sensy.py

      - name: End-to-end app tests (Streamlit AppTest)
        env:
          SENSYGENT_DB: ${{ runner.temp }}/ci.db
        run: python tests/test_app.py
